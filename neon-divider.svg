<svg viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @keyframes slideLight {
        0% {
          transform: translateX(-100px);
        }
        50% {
          transform: translateX(1200px);
        }
        100% {
          transform: translateX(-100px);
        }
      }
 
      .light-spot {
        animation: slideLight 4s ease-in-out infinite;
      }
    </style>
 
    <!-- Gradiente radial para efecto de foco -->
    <radialGradient id="spotLight" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0080FF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0080FF;stop-opacity:0" />
    </radialGradient>
 
    <!-- Sombra/glow -->
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
 
  <!-- Background -->
  <rect width="1200" height="40" fill="#0A0E27" opacity="0.5"/>
 
  <!-- Línea base (apenas visible) -->
  <line x1="0" y1="20" x2="1200" y2="20" 
        stroke="#00D9FF" 
        stroke-width="2" 
        opacity="0.1"/>
 
  <!-- Foco luminoso que se mueve -->
  <g class="light-spot">
    <ellipse cx="0" cy="20" rx="80" ry="12" 
             fill="url(#spotLight)" 
             filter="url(#glowEffect)"/>
  </g>
 
</svg>
 
