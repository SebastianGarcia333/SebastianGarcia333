<svg viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 8px #00D9FF) drop-shadow(0 0 15px #0080FF); }
        50% { filter: drop-shadow(0 0 15px #00D9FF) drop-shadow(0 0 30px #0080FF); }
      }
      @keyframes move {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -20; }
      }
      .neon-line { animation: glow 3s ease-in-out infinite; }
      .dash-line { animation: move 4s linear infinite; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="40" fill="#0A0E27" opacity="0.5"/>
  
  <!-- Main neon line -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="#00D9FF" stroke-width="2" class="neon-line"/>
  
  <!-- Dashed accent -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="#0080FF" stroke-width="1" stroke-dasharray="20,10" class="dash-line" opacity="0.6"/>
  
</svg>
