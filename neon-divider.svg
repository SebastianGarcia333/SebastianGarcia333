
<svg viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes drive {
        0% { transform: translateX(-180px); }
        100% { transform: translateX(1200px); }
      }

      .car-container { animation: drive 6s linear infinite; }
      .neon-blue { stroke: #00D9FF; filter: drop-shadow(0 0 3px #0080FF); }
    </style>
  </defs>

  <!-- Background (Opcional, se puede quitar para fondo transparente total) -->
  <rect width="1200" height="40" fill="#0A0E27" opacity="0.5"/>

  <!-- Las líneas neón originales han sido eliminadas para hacerlas invisibles -->

  <!-- Auto F1 sobre la barra invisible -->
  <g class="car-container">
    <g transform="translate(0, -11) scale(0.14)">
      
      <!-- Alerón Trasero -->
      <path d="M 10,25 L 100,25 L 100,60 L 130,60 L 130,135 L 10,135 Z" 
            fill="none" class="neon-blue" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 20,40 L 80,40" fill="none" class="neon-blue" stroke-width="6"/>

      <!-- Rueda Trasera -->
      <circle cx="165" cy="180" r="75" fill="#0A0E27" class="neon-blue" stroke-width="9"/>
      <circle cx="165" cy="180" r="45" fill="none" class="neon-blue" stroke-width="6"/>
      <circle cx="165" cy="180" r="18" fill="none" class="neon-blue" stroke-width="6"/>

      <!-- Cuerpo Principal del Monoplaza -->
      <path d="M 120,135 L 200,105 L 380,35 L 420,35 L 420,100 L 590,95 L 750,115 L 900,160 L 980,180 L 1010,230 L 910,230 L 880,175 L 820,175 L 630,235 L 285,235 Z" 
            fill="none" class="neon-blue" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- Toma de Aire y Molduras Laterales -->
      <path d="M 330,115 L 420,115" fill="none" class="neon-blue" stroke-width="7"/>
      <path d="M 285,160 L 630,145 L 630,225 L 285,225 Z" fill="none" class="neon-blue" stroke-width="8"/>
      <path d="M 460,165 L 610,165 L 610,215 L 460,215 Z" fill="none" class="neon-blue" stroke-width="7"/>

      <!-- Casco del Piloto (Azul Neón) -->
      <path d="M 435,95 C 435,55 520,55 520,95 C 520,120 435,120 435,95 Z" 
            fill="none" class="neon-blue" stroke-width="9"/>
      <path d="M 470,75 L 515,80 L 510,95 L 470,95 Z" 
            fill="none" class="neon-blue" stroke-width="6"/>

      <!-- Rueda Delantera -->
      <circle cx="765" cy="180" r="75" fill="#0A0E27" class="neon-blue" stroke-width="9"/>
      <circle cx="765" cy="180" r="45" fill="none" class="neon-blue" stroke-width="6"/>
      <circle cx="765" cy="180" r="18" fill="none" class="neon-blue" stroke-width="6"/>

      <!-- Alerón Delantero -->
      <path d="M 910,180 L 980,180 L 1020,220 L 910,220 Z" fill="none" class="neon-blue" stroke-width="8"/>
      
    </g>
  </g>
</svg>

