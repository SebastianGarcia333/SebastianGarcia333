<svg viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de Neón idéntico al de la imagen -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes drive {
        0% { transform: translateX(-180px); }
        100% { transform: translateX(1200px); }
      }

      .car-container { 
        animation: drive 3.5s linear infinite; 
      }

      .neon-cyan {
        stroke: #00D9FF;
        fill: none;
      }

      .spark {
        fill: #00D9FF;
        opacity: 0.8;
      }
    </style>
  </defs>

  <!-- Auto F1 con las chispas traseras en fondo 100% transparente -->
  <g class="car-container" filter="url(#neon-glow)">
    <g transform="translate(0, 8) scale(0.13)">
      
      <!-- Chispas/Partículas traseras idénticas a la imagen -->
      <circle cx="-20" cy="150" r="3" class="spark" />
      <circle cx="-40" cy="130" r="2" class="spark" />
      <circle cx="-55" cy="165" r="3.5" class="spark" />
      <circle cx="-15" cy="180" r="2.5" class="spark" />
      <circle cx="-35" cy="200" r="2" class="spark" />
      <circle cx="-70" cy="140" r="2.5" class="spark" />
      <circle cx="-80" cy="170" r="1.5" class="spark" />

      <!-- Alerón Trasero Neón Doble Borde -->
      <path d="M 10,25 L 100,25 L 100,60 L 130,60 L 130,135 L 10,135 Z" 
            class="neon-cyan" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 22,37 L 88,37 L 88,52 L 118,52 L 118,123 L 22,123 Z" 
            class="neon-cyan" stroke-width="4" stroke-linejoin="round"/>

      <!-- Rueda Trasera (Rím con 6 radios internos) -->
      <circle cx="165" cy="180" r="75" class="neon-cyan" stroke-width="8"/>
      <circle cx="165" cy="180" r="63" class="neon-cyan" stroke-width="4"/>
      <circle cx="165" cy="180" r="42" class="neon-cyan" stroke-width="5"/>
      <circle cx="165" cy="180" r="18" class="neon-cyan" stroke-width="5"/>
      <!-- Radios de la Rueda Trasera -->
      <line x1="165" y1="138" x2="165" y2="162" class="neon-cyan" stroke-width="5"/>
      <line x1="165" y1="198" x2="165" y2="222" class="neon-cyan" stroke-width="5"/>
      <line x1="128" y1="159" x2="149" y2="171" class="neon-cyan" stroke-width="5"/>
      <line x1="181" y1="189" x2="202" y2="201" class="neon-cyan" stroke-width="5"/>
      <line x1="128" y1="201" x2="149" y2="189" class="neon-cyan" stroke-width="5"/>
      <line x1="181" y1="171" x2="202" y2="159" class="neon-cyan" stroke-width="5"/>

      <!-- Chasis y Carrocería Principal Neón -->
      <path d="M 120,135 L 200,105 L 380,35 L 420,35 L 420,100 L 590,95 L 750,115 L 900,160 L 980,180 L 1010,230 L 910,230 L 880,175 L 820,175 L 630,235 L 285,235 Z" 
            class="neon-cyan" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- Moldura Central y Entrada de Aire -->
      <path d="M 330,115 L 420,115" class="neon-cyan" stroke-width="6"/>
      <path d="M 285,160 L 630,145 L 630,225 L 285,225 Z" class="neon-cyan" stroke-width="7"/>
      <path d="M 460,165 L 610,165 L 610,215 L 460,215 Z" class="neon-cyan" stroke-width="6"/>

      <!-- Casco del Piloto en Neón Azul -->
      <path d="M 435,95 C 435,55 520,55 520,95 C 520,120 435,120 435,95 Z" 
            class="neon-cyan" stroke-width="8"/>
      <path d="M 470,75 L 515,80 L 510,95 L 470,95 Z" 
            class="neon-cyan" stroke-width="6"/>

      <!-- Rueda Delantera (Rím con 6 radios internos) -->
      <circle cx="765" cy="180" r="75" class="neon-cyan" stroke-width="8"/>
      <circle cx="765" cy="180" r="63" class="neon-cyan" stroke-width="4"/>
      <circle cx="765" cy="180" r="42" class="neon-cyan" stroke-width="5"/>
      <circle cx="765" cy="180" r="18" class="neon-cyan" stroke-width="5"/>
      <!-- Radios de la Rueda Delantera -->
      <line x1="765" y1="138" x2="765" y2="162" class="neon-cyan" stroke-width="5"/>
      <line x1="765" y1="198" x2="765" y2="222" class="neon-cyan" stroke-width="5"/>
      <line x1="728" y1="159" x2="749" y2="171" class="neon-cyan" stroke-width="5"/>
      <line x1="781" y1="189" x2="802" y2="201" class="neon-cyan" stroke-width="5"/>
      <line x1="728" y1="201" x2="749" y2="189" class="neon-cyan" stroke-width="5"/>
      <line x1="781" y1="171" x2="802" y2="159" class="neon-cyan" stroke-width="5"/>

      <!-- Alerón Delantero -->
      <path d="M 910,180 L 980,180 L 1020,220 L 910,220 Z" class="neon-cyan" stroke-width="8"/>

    </g>
  </g>
</svg>
