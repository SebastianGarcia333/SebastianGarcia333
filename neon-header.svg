<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 10px #00D9FF) drop-shadow(0 0 20px #0080FF); }
        50% { filter: drop-shadow(0 0 20px #00D9FF) drop-shadow(0 0 40px #0080FF) drop-shadow(0 0 60px #00BFFF); }
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      @keyframes lightBeam {
        0% { transform: translateX(-100%); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateX(100%); opacity: 0; }
      }

      .glow-text { animation: glow 3s ease-in-out infinite; }
      .rotate-element { animation: rotate 10s linear infinite; transform-origin: 1050px 150px; }
      .pulse-element { animation: pulse 2.5s ease-in-out infinite; }
      .beam { animation: lightBeam 4s ease-in-out infinite; }
      
      text { font-family: 'Courier New', monospace; font-weight: bold; fill: #00D9FF; }
      .title { font-size: 60px; }
      .subtitle { font-size: 22px; fill: #00BFFF; }
    </style>

    <!-- Gradientes para el cielo -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#001F3F"/>
    </linearGradient>

    <linearGradient id="glowFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Patrón de cuadrícula tecnológica para el cielo -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 1. Fondo de cielo -->
  <rect width="1200" height="300" fill="url(#skyGrad)" />
  <rect width="1200" height="300" fill="url(#grid)" />

  <!-- 2. Rayos horizontales de luz de fondo (Animados) -->
  <rect x="0" y="80" width="1200" height="2" fill="#00D9FF" opacity="0.3" class="pulse-element"/>
  <rect x="0" y="140" width="1200" height="1.5" fill="#0080FF" opacity="0.2"/>
  <rect x="0" y="220" width="1200" height="2" fill="#00BFFF" opacity="0.3" class="pulse-element" style="animation-delay: 1s;"/>

  <!-- Light beam effect -->
  <rect x="0" y="100" width="400" height="3" fill="url(#glowFloor)" class="beam"/>

  <!-- Resplandor azul en la base inferior -->
  <rect x="0" y="260" width="1200" height="40" fill="url(#glowFloor)"/>
  <line x1="50" y1="275" x2="1150" y2="275" stroke="#00D9FF" stroke-width="2" class="glow-text"/>

  <!-- 3. Marcos y decoraciones geométricas -->
  <rect x="50" y="30" width="1100" height="240" fill="none" stroke="#00D9FF" stroke-width="2" rx="15" class="glow-text"/>
  
  <!-- Círculos decorativos superiores -->
  <circle cx="70" cy="50" r="7" fill="#00D9FF" class="glow-text"/>
  <circle cx="95" cy="50" r="7" fill="#0080FF" class="glow-text"/>
  <circle cx="120" cy="50" r="7" fill="#00BFFF" class="glow-text"/>

  <!-- Elemento circular giratorio (Derecha) -->
  <g class="rotate-element">
    <circle cx="1050" cy="150" r="75" fill="none" stroke="#00BFFF" stroke-width="2" stroke-dasharray="10, 15" opacity="0.7"/>
    <circle cx="1050" cy="150" r="60" fill="none" stroke="#0080FF" stroke-width="1.5" stroke-dasharray="5, 5" opacity="0.5"/>
  </g>
  <circle cx="1050" cy="150" r="12" fill="#00D9FF" class="pulse-element glow-text"/>

  <!-- Pixeles/partículas flotantes -->
  <rect x="1080" y="80" width="6" height="6" fill="#00D9FF" class="pulse-element"/>
  <rect x="1100" y="120" width="5" height="5" fill="#0080FF" class="pulse-element" style="animation-delay: 0.4s;"/>
  <rect x="1090" y="200" width="8" height="8" fill="#00BFFF" class="pulse-element" style="animation-delay: 0.8s;"/>

  <!-- 4. TEXTOS PRINCIPALES -->
  <text x="80" y="145" class="title glow-text">SEBASTIAN GARCIA</text>
  <text x="80" y="195" class="subtitle glow-text">Systems Engineering | Software Developer | Aspiring Cloud Engineer</text>

</svg>
