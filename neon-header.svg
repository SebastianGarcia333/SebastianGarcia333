<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 10px #00D9FF) drop-shadow(0 0 20px #0080FF); }
        50% { filter: drop-shadow(0 0 20px #00D9FF) drop-shadow(0 0 40px #0080FF) drop-shadow(0 0 60px #00BFFF); }
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .glow-text { animation: glow 3s ease-in-out infinite; }
      .rotate-element { animation: rotate 8s linear infinite; transform-origin: 600px 150px; }
      .pulse-element { animation: pulse 2s ease-in-out infinite; }
      
      text { font-family: 'Courier New', monospace; font-weight: bold; fill: #00D9FF; }
      .title { font-size: 64px; }
      .subtitle { font-size: 24px; fill: #00BFFF; }
      .terminal { font-size: 18px; fill: #0080FF; }
    </style>
    
    <filter id="neonBlue">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="#0A0E27"/>
  
  <!-- Animated border glow -->
  <g class="rotate-element">
    <rect x="50" y="30" width="1100" height="240" fill="none" stroke="#00D9FF" stroke-width="3" rx="15" opacity="0.3"/>
  </g>
  
  <!-- Static border -->
  <rect x="50" y="30" width="1100" height="240" fill="none" stroke="#00D9FF" stroke-width="2" rx="15" class="glow-text"/>
  
  <!-- Corner decorations -->
  <circle cx="70" cy="50" r="8" fill="#00D9FF" class="glow-text"/>
  <circle cx="100" cy="50" r="8" fill="#0080FF" class="glow-text"/>
  <circle cx="130" cy="50" r="8" fill="#00BFFF" class="glow-text"/>
  
  <!-- Terminal prompt -->
  <text x="80" y="110" class="terminal glow-text">$ whoami</text>
  
  <!-- Main title -->
  <text x="80" y="180" class="title glow-text">SEBASTIAN GARCIA</text>
  
  <!-- Subtitle -->
  <text x="80" y="220" class="subtitle glow-text">Systems Engineering | Software Engineering | Cloud (AWS)</text>
  
  <!-- Rotating circle element on the right -->
  <g class="rotate-element">
    <circle cx="1050" cy="150" r="80" fill="none" stroke="#00BFFF" stroke-width="2" opacity="0.5"/>
    <circle cx="1050" cy="150" r="70" fill="none" stroke="#0080FF" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Pulsing center dot -->
  <circle cx="1050" cy="150" r="15" fill="#00D9FF" class="pulse-element glow-text"/>
  
  <!-- Small floating pixels -->
  <rect x="1080" y="80" width="8" height="8" fill="#00D9FF" class="pulse-element"/>
  <rect x="1100" y="120" width="6" height="6" fill="#0080FF" class="pulse-element" style="animation-delay: 0.3s;"/>
  <rect x="1090" y="200" width="10" height="10" fill="#00BFFF" class="pulse-element" style="animation-delay: 0.6s;"/>
  
  <!-- Status indicator -->
  <circle cx="1150" cy="260" r="5" fill="#00FF00"/>
  <text x="900" y="265" font-size="14" fill="#00FF00" font-family="'Courier New', monospace">● ONLINE</text>
</svg>
